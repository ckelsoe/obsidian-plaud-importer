# Keeps the SHA-pinned GitHub Actions current. One grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week before taking a new release, so a compromised one is
    # usually caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
