name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PLUGIN_NAME: plaud-importer
  # Opt into Node.js 24 for JavaScript actions (see ci.yml note).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: VirusTotal scan of release artifacts
        # Advisory only: an upload error (e.g. HTTP 409 when a version bump does
        # not change main.js, so VirusTotal already has the identical file) must
        # not block publishing the release. The scan reports, it does not gate.
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          echo "Extracted release notes:"
          cat release-notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Decide GitHub pre-release status from the tag. A semver pre-release
          # has a MAJOR.MINOR.PATCH-<identifiers> core (e.g. 0.41.0-beta.1, or
          # 1.2.3-beta.1+sha.abc); a stable tag is MAJOR.MINOR.PATCH with no
          # -<identifiers> part. Strip any +build metadata first, then match the
          # shape. This is a shape gate, not a full semver validator: over-
          # marking an odd hand-typed tag as a pre-release is the safe direction
          # (it stays out of the store), and the check never marks a real
          # pre-release as a stable release. A GitHub pre-release does not become
          # the repo's "latest", which Obsidian's community updater tracks, so
          # store users are never offered a beta, while BRAT installs
          # pre-releases for opted-in testers.
          core="${tag%%+*}"
          prerelease_flag=""
          if [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            prerelease_flag="--prerelease"
          fi
          if [ -s release-notes.md ]; then
            gh release create "$tag" $prerelease_flag \
              --title="$tag" \
              --notes-file release-notes.md \
              main.js manifest.json styles.css
          else
            gh release create "$tag" $prerelease_flag \
              --title="$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
