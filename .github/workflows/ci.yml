name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly security sweep (OSV, zizmor) so new advisories surface even
    # when no code changes. Everything else runs locally (npm run ci).
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Type coverage
        run: npm run type-coverage

      - name: Build
        run: npm run build

      - name: Validate Obsidian manifest
        run: |
          echo "Validating manifest.json..."
          # Check required fields exist
          for field in id name version minAppVersion description author; do
            if ! jq -e ".$field" manifest.json > /dev/null 2>&1; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done
          # Check version format (semver)
          VERSION=$(jq -r '.version' manifest.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          # Check versions.json exists and contains current version
          if [ -f versions.json ]; then
            if ! jq -e ".[\"$VERSION\"]" versions.json > /dev/null 2>&1; then
              echo "::warning::Version $VERSION not found in versions.json"
            fi
          fi
          echo "Manifest validation passed"

      - name: Check for deprecated Obsidian API usage
        run: |
          echo "Scanning for known deprecated Obsidian APIs..."
          FOUND=0
          SOURCES=(main.ts import-modal.ts plaud-client-re.ts)

          # grep exits 1 for no match; anything higher is a scan error and must fail.
          check_deprecated() {
            local status=0
            grep -n "$1" "${SOURCES[@]}" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$2"
              FOUND=1
            elif [ "$status" -gt 1 ]; then
              echo "::error::Deprecated API scan failed (grep exited with $status)"
              exit "$status"
            fi
          }

          check_deprecated '\.activeLeaf\b' "Deprecated API: 'activeLeaf'. Use getActiveViewOfType() or getLeaf() instead."
          check_deprecated 'renderMarkdown(' "Deprecated API: 'renderMarkdown'. Use MarkdownRenderer.render() instead."
          check_deprecated 'getLeaf(true)\|getLeaf(false)' "Deprecated API: 'getLeaf(bool)'. Use getLeaf('tab') or getLeaf('split') instead."
          check_deprecated '\.noticeEl\b' "Deprecated API: 'noticeEl'. Use 'messageEl' instead."

          if [ "$FOUND" -eq 0 ]; then
            echo "No deprecated Obsidian API usage found."
          else
            exit 1
          fi

      - name: Check bundle size
        run: |
          SIZE=$(stat -c%s main.js 2>/dev/null || stat -f%z main.js)
          echo "Bundle size: $SIZE bytes ($(echo "scale=2; $SIZE/1024" | bc) KB)"
          if [ "$SIZE" -gt 500000 ]; then
            echo "::warning::Bundle size exceeds 500KB"
          fi

  osv-scan:
    if: github.event_name != 'pull_request'
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --recursive

  zizmor:
    if: github.event_name != 'pull_request'
    name: zizmor
    # Audits the workflows, including advisories against the SHA-pinned
    # actions, which Dependabot does not alert on. The weekly cron re-checks.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.31.1
